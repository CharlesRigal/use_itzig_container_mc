<div class="cols">
{% for field in fields %}
  <p class="{% if field.widget_type == 'checkbox' %}check{% endif %}{% if field.widget_type == 'textarea' %} wide{% endif %}">
    {% if field.widget_type == 'checkbox' %}{{ field }} {{ field.label_tag }}{% else %}{{ field.label_tag }} {{ field }}{% endif %}
    {% if field.help_text %}<br><span class="helptext">{{ field.help_text }}</span>{% endif %}
    {{ field.errors }}
  </p>
{% endfor %}
</div>
